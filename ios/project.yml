name: CrocTick
options:
  bundleIdPrefix: com.croctick
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  CrocTick:
    type: application
    platform: iOS
    info:
      path: CrocTick/Info.plist
    sources:
      - CrocTick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.croctick.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
